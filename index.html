<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Replays</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
    background: #fafafa;
  }
  h1 {
    border-bottom: 2px solid #ddd;
    padding-bottom: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid #e0e0e0;
  }
  th {
    background: #f0f0f0;
    font-weight: 600;
  }
  tr:hover td {
    background: #f5f5f5;
  }
  a {
    color: #2266aa;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
  .loading, .error {
    padding: 20px;
    text-align: center;
    color: #666;
  }
  .error {
    color: #aa3333;
  }
</style>
</head>
<body>
<h1>Battle Replays</h1>
<div id="content"><p class="loading">Loading replays...</p></div>
<script>
(function() {
  var content = document.getElementById('content');

  function parseFilename(name) {
    var m = name.match(/^(.+?)-(\d{4}-\d{2}-\d{2})-(.+?)-(.+)\.html$/);
    if (!m) return null;
    return { format: m[1], date: m[2], user1: m[3], user2: m[4], file: name };
  }

  function render(files) {
    var replays = files
      .map(function(f) { return parseFilename(f); })
      .filter(function(r) { return r !== null; });

    replays.sort(function(a, b) { return b.date.localeCompare(a.date); });

    if (replays.length === 0) {
      content.innerHTML = '<p class="loading">No replays found.</p>';
      return;
    }

    var html = '<table><thead><tr><th>Date</th><th>User 1</th><th>User 2</th></tr></thead><tbody>';
    replays.forEach(function(r) {
      html += '<tr>'
        + '<td><a href="s14_replays/' + encodeURIComponent(r.file) + '">' + r.date + '</a></td>'
        + '<td>' + r.user1 + '</td>'
        + '<td>' + r.user2 + '</td>'
        + '</tr>';
    });
    html += '</tbody></table>';
    content.innerHTML = html;
  }

  // Try GitHub API first (works for public repos)
  var path = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
  var parts = path.split('/').filter(Boolean);
  var host = window.location.hostname;

  if (host.endsWith('.github.io')) {
    var owner = host.replace('.github.io', '');
    var repo = parts[0] || owner + '.github.io';
    var apiPath = parts.length > 1 ? parts.slice(1).join('/') : '';
    var apiUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + (apiPath ? apiPath + '/' : '') + 's14_replays';

    fetch(apiUrl)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!Array.isArray(data)) throw new Error('Unexpected response');
        var htmlFiles = data
          .filter(function(f) { return f.name.endsWith('.html') && f.name !== 'index.html'; })
          .map(function(f) { return f.name; });
        render(htmlFiles);
      })
      .catch(function() {
        content.innerHTML = '<p class="error">Could not load file list from GitHub API. If this is a private repo, you may need a static file list.</p>';
      });
  } else {
    content.innerHTML = '<p class="error">This page is designed to run on GitHub Pages.</p>';
  }
})();
</script>
</body>
</html>
